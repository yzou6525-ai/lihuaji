<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./style.css"><title>苏绣产品试戴与搭配</title></head><body class="face-page"><style>.face-page{padding:18px;background:#f4f5ee}.face-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.face-stage{min-height:320px;background:#e8eddf;border-radius:10px;display:grid;place-items:center;overflow:hidden}.face-stage canvas{width:100%;max-height:480px;object-fit:contain;touch-action:none}.face-tools{display:grid;gap:10px;align-content:start}.face-tools label{margin:0}.face-tools button{padding:8px}.face-tools input[type=range]{padding:0}.product-photo{display:block;width:100%;height:210px;object-fit:contain;background:white;border-radius:8px}.preview-picker{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-bottom:12px}.variant-note{padding:12px;background:#fff7e6;border-radius:8px;font-size:12px}.face-stage-wrap{min-width:0}.face-layout select{max-width:100%}@media(max-width:700px){.face-layout{grid-template-columns:1fr}.face-stage{min-height:220px}.face-stage canvas{max-height:330px}.preview-picker{grid-template-columns:1fr}.face-tools{grid-template-columns:1fr 1fr}.face-tools .full{grid-column:1/-1}}.preview-thumbs{display:flex;gap:10px;overflow-x:auto;max-width:100%;padding:5px 2px 12px;margin-bottom:10px}.preview-thumbs button{flex:0 0 116px;max-width:116px;padding:6px;display:flex;flex-direction:column;align-items:stretch}.preview-thumbs img{height:82px;width:100%;object-fit:contain}.preview-thumbs span{font-size:11px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.preview-thumbs button[aria-pressed=true]{border:2px solid #244e43;background:#e8ede4}</style>
<p id="catalog-count" class="sub">正在读取商品与款式…</p><div class="preview-picker"><select id="category" aria-label="商品分类"><option value="">全部分类</option></select><input id="search" placeholder="搜索眼罩、丝巾、手链、摆件…" aria-label="搜索试戴商品"></div><div id="product-strip" class="preview-thumbs" aria-label="商品图册"></div><label>选择商品<select id="product" aria-label="试戴产品"></select></label><label>选择具体款式<select id="variant" aria-label="商品款式"></select></label><p id="variant-note" class="variant-note"></p><div class="face-layout"><div class="face-stage-wrap"><div class="face-stage"><canvas id="canvas" width="800" height="520" aria-label="商品搭配画布"></canvas></div><p class="small">照片搭配模式可拖动商品，调整大小与角度；眼罩放在眼部，丝巾放在颈肩，手链放在手腕，摆件放在桌面。未进行人体尺寸或空间测量。</p><label class="check"><input id="consent" type="checkbox">同意本次在设备内处理照片或摄像头画面。自动跟脸仅在设备内识别人脸；保存只下载到本机，不上传。</label><p id="status" role="status" class="small">选择款式后，勾选同意并上传照片或开启摄像头。</p></div><div class="face-tools"><img id="product-photo" class="product-photo full" alt="当前商品图片"><label class="full">预览方式<select id="preview-mode"><option value="manual">照片搭配 / 手动摆放</option><option value="face">自动跟脸 · 专用眼罩贴图</option></select></label><button id="camera" class="primary" disabled>开启摄像头</button><button id="stop">关闭摄像头</button><label class="full">选择人像或场景照片<input id="photo" type="file" accept="image/*" disabled></label><label>大小<input id="scale" type="range" min="0.1" max="2.4" step="0.05" value="1"></label><label>旋转<input id="rotation" type="range" min="-180" max="180" value="0"></label><label class="full">使用图片<select id="picture" aria-label="参考图片"></select></label><button id="center" class="full">恢复居中</button><label class="check"><input id="mirror" type="checkbox">镜像画面</label><label class="check"><input id="original" type="checkbox">看原图</label><button id="download">保存到本机</button><button id="clear" class="full">清除照片与关键点</button></div></div><script type="module" src="./face.js"></script></body></html>
